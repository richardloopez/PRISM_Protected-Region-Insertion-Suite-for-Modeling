# ============================================================================
# PROTECTED-REGION INSERTION SUITE FOR MODELING (PRISM) - CONFIGURATION
# ============================================================================
# Professional configuration file for the PRISM pipeline.
# Comments and section headers are preserved during GUI updates.

# -- 1. Sequence & Identity ---------------------------------------------------
ALIGN_CODE_SEQUENCE: FullSeq
CHAIN_ID: A
BLK_CHAIN_ID: B

# -- 2. Input Files (basenames only) ------------------------------------------
FASTA_FILE_BASENAME: sequence_full.fasta
SS2_FILE_BASENAME: secondary_structure.ss2
MANUAL_ALIGNMENT_BASENAME: manual_template_FullSeq.ali
CUSTOM_INIFILE_BASENAME: precomputed_ini.pdb
CUSTOM_RSRFILE_BASENAME: precomputed_rsr.rsr
PDB_TEMPLATE_FILES_NAMES:
- experimental-test.pdb
- predicted-test.pdb

# -- 3. Modeling Parameters ---------------------------------------------------
TOTAL_HOMOLOGY_MODELS: 10000
TOP_MODELS_FOR_REFINEMENT: 10
LOOP_MODELS_PER_TARGET: 10
NUM_BEST_FINAL_MODELS: inf

# -- 4. Experimental Region Control -------------------------------------------
BLOCK_REPULSION_RADIUS: 100.0
MOBILE_FLANK_RESIDUES: 3
REFINE_FLANKS_DURING_AUTOMODEL: true
USE_MANUAL_OPTIMIZATION_SELECTION: false
MANUAL_OPTIMIZATION_RESIDUES: []
USE_MANUAL_FIXATION_SELECTION: false
MANUAL_FIXATION_RESIDUES: []

# -- 5. Execution Engine ------------------------------------------------------
EXECUTION_PARADIGM: prism-power # Options: normal | precalculation | precomputed | prism-power
MODELLER_CORES: 10
TOTAL_PARALLEL_JOBS: 10
PRISM_POWER_SETTINGS:
  PRECALCULATION:
    experimental-test.pdb: 1000
    predicted-test.pdb: 1
  PRECOMPUTED:
    experimental-test.pdb: 1
    predicted-test.pdb: 1

# -- 6. External Services -----------------------------------------------------
PERFORM_PSIPRED_PREDICTION: true
PSIPRED_EMAIL: richard.lopezc@uah.es
PSIPRED_POLL_INTERVAL: 60
USE_MANUAL_ALIGNMENT: true

# -- 7. Directories (internal constants) --------------------------------------
INPUT_DIR_NAME: input
MODELING_RESULTS_DIR_NAME: modeling_results
PSIPRED_RESULTS_DIR_NAME: psipred_results
